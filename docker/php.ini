; Réglages PHP de l'application, copiés dans l'image par le Dockerfile.
; Tailles maximales d'une requête et d'un fichier envoyé.
post_max_size = 64M
upload_max_filesize = 64M
; Suivi de l'avancement des envois (barre de progression de public/demandes.php).
session.upload_progress.enabled = On
; Erreurs écrites dans le journal (docker compose logs), jamais dans la page : un message affiché
; renseigne un attaquant, et empêche les redirections (« headers already sent »).
display_errors = Off
log_errors = On
